    <text x="0" y="92" fill="#f7fbff" font-family="Georgia, Cambria, serif" font-size="58" font-weight="700" letter-spacing="-1">LaunchSieve</text>
    <text x="2" y="137" fill="#afc3d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Clarity, trust, and craft—without clutter.</text>
    <rect x="0" y="174" width="646" height="2" fill="url(#accent)" opacity=".72"/>
    <text x="2" y="220" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">EVIDENCE BEFORE DECORATION</text>
    <text x="2" y="257" fill="#93abc1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">AUDIT  ·  DESIGN  ·  VERIFY  ·  PUBLISH</text>
