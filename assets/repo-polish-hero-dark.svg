<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LaunchSieve</title>
  <desc id="desc">Evidence before decoration. Clarity, trust, and craft for open-source repositories.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbeafe" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#0b1524"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <g transform="translate(92 84)">
    <rect width="252" height="252" rx="58" fill="#101f32" stroke="#dbeafe" stroke-opacity=".15" stroke-width="2"/>
    <path d="M62 72h128M62 116h92M62 160h112" stroke="#e7f3ff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="190" cy="174" r="42" fill="url(#accent)"/>
